<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Pipeline: collect, official data, clean, adjust, test, publish">
  <rect x="0" y="0" width="960" height="420" rx="16" fill="#fcfcfb"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0b0b0b">How the daily pipeline works</text>
  <text x="32" y="68" font-size="13" fill="#52514e">Runs every morning on a home computer (launchd). The private dashboard stays local; a privacy-checked copy is published.</text>

  <!-- row 1 -->
  <g font-size="13">
    <rect x="32" y="96" width="200" height="110" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
    <text x="48" y="122" font-size="15" font-weight="700" fill="#0b0b0b">1. Collect</text>
    <text x="48" y="146" fill="#52514e">OpenRent area searches,</text>
    <text x="48" y="164" fill="#52514e">listing pages, landlords'</text>
    <text x="48" y="182" fill="#52514e">past lets (let-agreed dates)</text>

    <rect x="264" y="96" width="200" height="110" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
    <text x="280" y="122" font-size="15" font-weight="700" fill="#0b0b0b">2. Official data</text>
    <text x="280" y="146" fill="#52514e">ONS rent index &amp; area</text>
    <text x="280" y="164" fill="#52514e">prices, EPCs, stations,</text>
    <text x="280" y="182" fill="#52514e">tribunal decisions</text>

    <rect x="496" y="96" width="200" height="110" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
    <text x="512" y="122" font-size="15" font-weight="700" fill="#0b0b0b">3. Clean</text>
    <text x="512" y="146" fill="#52514e">Drop bills-included, rooms,</text>
    <text x="512" y="164" fill="#52514e">short lets, duplicates,</text>
    <text x="512" y="182" fill="#52514e">other markets, outliers</text>

    <rect x="728" y="96" width="200" height="110" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
    <text x="744" y="122" font-size="15" font-weight="700" fill="#0b0b0b">4. Adjust</text>
    <text x="744" y="146" fill="#52514e">Time, location, building,</text>
    <text x="744" y="164" fill="#52514e">station, layout, energy,</text>
    <text x="744" y="182" fill="#52514e">size: every % shown</text>
  </g>
  <g stroke="#898781" stroke-width="2" fill="none">
    <path d="M232 151 H264"/><path d="M464 151 H496"/><path d="M696 151 H728"/>
    <path d="M828 206 V236 H598 V262"/><path d="M598 236 H368 V262"/>
  </g>

  <!-- row 2 -->
  <g font-size="13">
    <rect x="264" y="262" width="200" height="110" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
    <text x="280" y="288" font-size="15" font-weight="700" fill="#0b0b0b">5. Test</text>
    <text x="280" y="312" fill="#52514e">Sensitivity table: every</text>
    <text x="280" y="330" fill="#52514e">distance and period, with</text>
    <text x="280" y="348" fill="#52514e">bootstrap intervals</text>

    <rect x="496" y="262" width="200" height="110" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
    <text x="512" y="288" font-size="15" font-weight="700" fill="#0b0b0b">Private dashboard</text>
    <text x="512" y="312" fill="#52514e">Local only: evidence log,</text>
    <text x="512" y="330" fill="#52514e">key dates, spreadsheet for</text>
    <text x="512" y="348" fill="#52514e">the tribunal forms</text>

    <rect x="728" y="262" width="200" height="110" rx="12" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
    <text x="744" y="288" font-size="15" font-weight="700" fill="#0b0b0b">6. Publish</text>
    <text x="744" y="312" fill="#52514e">Strip private data, scan</text>
    <text x="744" y="330" fill="#52514e">for names/postcodes, then</text>
    <text x="744" y="348" fill="#52514e">upload to Cloudflare Pages</text>
  </g>
  <g stroke="#898781" stroke-width="2" fill="none"><path d="M464 317 H496"/><path d="M696 317 H728"/></g>
</svg>
